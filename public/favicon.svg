<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Outer Ring Gradients -->
        <linearGradient id="outerMagentaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d91b5c"></stop>
            <stop offset="100%" stop-color="#ff4b72"></stop>
        </linearGradient>

        <linearGradient id="outerOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5e62"></stop>
            <stop offset="100%" stop-color="#ff9900"></stop>
        </linearGradient>

        <linearGradient id="outerNavyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0f172a"></stop>
            <stop offset="100%" stop-color="#1e293b"></stop>
        </linearGradient>

        <!-- Inner Ring Gradients -->
        <linearGradient id="innerGreyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"></stop>
            <stop offset="30%" stop-color="#e2e8f0"></stop>
            <stop offset="70%" stop-color="#94a3b8"></stop>
            <stop offset="100%" stop-color="#475569"></stop>
        </linearGradient>

        <linearGradient id="innerMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4b72"></stop>
            <stop offset="100%" stop-color="#9d003c"></stop>
        </linearGradient>
    </defs>

    <!-- Outer Ring Segments (Radius 75, Stroke Width 14, Rounded Caps) -->
    <!-- Top-Right Magenta/Pink Segment -->
    <path d="M 92.00 25.43 A 75 75 0 0 1 161.44 143.02" fill="none" stroke="url(#outerMagentaGrad)" stroke-width="14" stroke-linecap="round"></path>

    <!-- Bottom Orange/Yellow Segment -->
    <path d="M 143.02 161.44 A 75 75 0 0 1 46.97 153.03" fill="none" stroke="url(#outerOrangeGrad)" stroke-width="14" stroke-linecap="round"></path>

    <!-- Left Dark Navy Segment -->
    <path d="M 32.03 131.70 A 75 75 0 0 1 73.00 29.00" fill="none" stroke="url(#outerNavyGrad)" stroke-width="14" stroke-linecap="round"></path>

    <!-- Inner Ring Segments (Radius 46, Stroke Width 21, Sharp Radial Cuts) -->
    <!-- Metallic Grey Inner Segment -->
    <path d="M 129.57 135.24 A 46 46 0 1 1 143.23 84.27" fill="none" stroke="url(#innerGreyGrad)" stroke-width="21"></path>

    <!-- Accent Magenta Inner Segment -->
    <path d="M 144.43 88.10 A 46 46 0 0 1 132.53 132.53" fill="none" stroke="url(#innerMagentaGrad)" stroke-width="21"></path>
</svg>
